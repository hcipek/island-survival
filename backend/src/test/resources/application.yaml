# Replaces src/main/resources/application.yaml during tests, so tests run
# against a throwaway in-memory database instead of the real save file.
spring:
  datasource:
    url: jdbc:h2:mem:testproject;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
